<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>NextXus Music Player</title>
<meta name="description" content="Roger's own playlist player — every song streamed from the NextXus Music GitHub release."/>
<style>
:root{--bg:#0a0a0a;--panel:#111614;--line:rgba(0,255,136,.25);--text:#e8e8e8;--dim:#a8b3ad;--green:#00ff88;--cyan:#00d4ff}
*{box-sizing:border-box}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.6;max-width:46rem;margin:0 auto;padding:1rem}
h1{font-size:1.6rem;margin:.5rem 0}
.sub{color:var(--dim);font-size:1rem;margin:0 0 1rem}
#nowplaying{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1rem;margin-bottom:1rem}
#nowplaying .label{color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:.08em}
#nowplaying .title{font-size:1.35rem;font-weight:700;color:var(--green);margin:.25rem 0}
#controls{display:flex;gap:.75rem;margin-bottom:1.25rem}
#controls button{flex:1;font-size:1.5rem;padding:.9rem .5rem;border-radius:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
#controls button:active{background:#1a221e}
#playbtn{flex:2 !important;color:#04120a !important;background:var(--green) !important;font-weight:800}
ol#tracklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
ol#tracklist li{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.8rem 1rem;cursor:pointer;font-size:1.05rem;display:flex;gap:.75rem;align-items:baseline}
ol#tracklist li .n{color:var(--dim);min-width:2.2em;text-align:right}
ol#tracklist li.playing{border-color:var(--green);box-shadow:0 0 0 2px rgba(0,255,136,.35)}
ol#tracklist li.playing .t{color:var(--green);font-weight:700}
ol#tracklist li a{color:var(--cyan);font-size:.85rem;margin-left:auto;white-space:nowrap}
footer{color:var(--dim);font-size:.9rem;margin-top:1.5rem}
a{color:var(--cyan)}
body.embed header.top, body.embed footer{display:none}
body.embed{padding:.5rem}
body.embed #banner{display:none}
</style>
</head>
<body>
<header class="top">
<h1>&#127925; NextXus Music Player</h1>
<p class="sub">Roger's playlist — streamed free from GitHub. Tap any song to play.</p>
</header>
<video id="banner" autoplay muted loop playsinline style="width:100%;border-radius:.8rem;border:1px solid var(--line);display:block;margin-bottom:1rem"></video>
<div id="nowplaying">
  <div class="label">Now playing</div>
  <div class="title" id="nptitle">Pick a song below</div>
</div>
<div id="controls">
  <button id="prevbtn" aria-label="Previous">&#9198; Prev</button>
  <button id="playbtn" aria-label="Play or pause">&#9654; Play</button>
  <button id="nextbtn" aria-label="Next">Next &#9197;</button>
</div>
<ol id="tracklist"></ol>
<footer><a href="./">Back to NextXus Music</a> &middot; Songs by Roger Keyserling and AI</footer>
<audio id="audio" preload="none"></audio>
<script>
if (new URLSearchParams(location.search).get("embed") === "1") document.body.classList.add("embed");
var RELEASE_TAG = "playlist-v1";
var ASSET_BASE = "https://github.com/Keywebco/nextxus-music/releases/download/" + RELEASE_TAG + "/";
document.getElementById("banner").src = ASSET_BASE + "player-banner.mp4";
var tracks = [], idx = -1;
var audio = document.getElementById("audio");
var nptitle = document.getElementById("nptitle");
var playbtn = document.getElementById("playbtn");
var list = document.getElementById("tracklist");

function render() {
  list.innerHTML = "";
  tracks.forEach(function(t, i) {
    var li = document.createElement("li");
    if (i === idx) li.className = "playing";
    var n = document.createElement("span"); n.className = "n"; n.textContent = (i + 1) + ".";
    var tt = document.createElement("span"); tt.className = "t"; tt.textContent = t.title;
    li.appendChild(n); li.appendChild(tt);
    if (t.voices_url) {
      var a = document.createElement("a"); a.href = t.voices_url; a.textContent = "song page";
      a.target = "_blank"; a.rel = "noopener";
      a.addEventListener("click", function(e){ e.stopPropagation(); });
      li.appendChild(a);
    }
    li.addEventListener("click", function(){ play(i); });
    list.appendChild(li);
  });
}
function play(i) {
  idx = (i + tracks.length) % tracks.length;
  audio.src = ASSET_BASE + encodeURIComponent(tracks[idx].file);
  audio.play();
  nptitle.textContent = tracks[idx].title;
  playbtn.innerHTML = "&#10074;&#10074; Pause";
  render();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: tracks[idx].title, artist: "Roger Keyserling and AI" });
  }
}
function toggle() {
  if (idx < 0) { play(0); return; }
  if (audio.paused) { audio.play(); playbtn.innerHTML = "&#10074;&#10074; Pause"; }
  else { audio.pause(); playbtn.innerHTML = "&#9654; Play"; }
}
playbtn.addEventListener("click", toggle);
document.getElementById("prevbtn").addEventListener("click", function(){ play(idx < 0 ? 0 : idx - 1); });
document.getElementById("nextbtn").addEventListener("click", function(){ play(idx < 0 ? 0 : idx + 1); });
audio.addEventListener("ended", function(){ play(idx + 1); });
fetch("playlist.json").then(function(r){ return r.json(); }).then(function(j){
  tracks = j; render();
}).catch(function(){
  nptitle.textContent = "Could not load the playlist.";
});
</script>
</body>
</html>
